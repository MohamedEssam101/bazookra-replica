<section
  class="min-h-20 flex m-auto justify-between shadow-[0_0_25px_-6px_rgba(255,255,255,0.8)]"
>
  <!-- left logo -->
  <div class="h-12 flex self-center">
    <img src="/images/bazookaLogo.png" class="h-10 sm:h-12" />
    <app-sidebar class="lg:hidden self-center mr-2 ml-2"></app-sidebar>
  </div>
  <!-- Middle menu -->
  <div class="hidden lg:inline self-center">
    <nav>
      <ul class="flex gap-3 font-semibold">
        <li
          class="bg-[url('/images/buttons2.png')] bg-contain bg-center bg-no-repeat h-auto py-3 text-center hover:bg-[url('/images/buttons2-hover.png')] transition-all ease-in-out duration-300 cursor-pointer"
          routerLink="/home"
        >
          <a class="text-white bg-center px-8 hover:text-black">
            {{ "Home" | translate }}
          </a>
        </li>
        <li
          class="bg-[url('/images/buttons2.png')] bg-contain bg-center bg-no-repeat hover:bg-[url('/images/buttons2-hover.png')] h-auto py-3 text-center transition-all ease-in-out duration-300 cursor-pointer"
          routerLink="/menu"
        >
          <a class="text-white bg-center px-8 hover:text-black">
            {{ "Menu" | translate }}
          </a>
        </li>
        <li
          class="bg-[url('/images/buttons2.png')] bg-contain bg-center bg-no-repeat hover:bg-[url('/images/buttons2-hover.png')] h-auto py-3 text-center transition-all ease-in-out duration-300 cursor-pointer"
          routerLink="/cart"
        >
          <a class="text-white bg-center px-8 hover:text-black">
            {{ "Cart" | translate }}
            <i class="pi pi-shopping-cart text-black"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
  <!-- hotline and profile -->
  <div class="flex justify-between gap-3 self-center">
    <!-- hotline -->
    <img src="/images/hotline.png" class="max-h-11 hidden md:inline" />

    <!-- country -->

    <!-- Profile -->
    <div class="items-center flex gap-1 sm:gap-2" (click)="toggleEvent($event)">
      <i
        class="pi pi-user text-black bg-yellow-300 text-2xl border-2 border-yellow-300 rounded-xl"
        style="font-size: 1.6rem"
      >
      </i>
      <span class="text-yellow-300 cursor-pointer hidden md:inline">{{
        "Profile" | translate
      }}</span>
      @if(loggedIn$ | async){
      <!-- if true  -->
      <p-tieredmenu
        #menu
        [model]="userItems"
        [popup]="true"
        styleClass="mt-3 bg-black border-black "
      />

      }@else{
      <p-tieredmenu
        #menu
        [model]="guestItems"
        [popup]="true"
        styleClass="mt-3 bg-black border-black "
      />

      }
      <p-button
        styleClass="bg-yellow-300 mr-3 border-yellow-300 text-black font-semibold"
        (click)="changeLanguage()"
      >
        {{ translate.currentLang === "ar" ? "english" : "العربية " }}
      </p-button>
      <!-- language changer -->
    </div>
  </div>
</section>
