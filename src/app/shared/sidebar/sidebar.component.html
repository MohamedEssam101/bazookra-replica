<div>
  <p-drawer
    #drawerRef
    [(visible)]="visible"
    styleClass="bg-[url('/images/home-background.jpg')] bg-cover bg-no-repeat  text-yellow-300  "
  >
    <ng-template #headless>
      <div class="flex flex-col h-full">
        <div class="flex items-center justify-between px-6 pt-4 shrink-0">
          <span class="text-2xl font-bold"> Bazooka </span>
          <span>
            <p-button
              type="button"
              (click)="closeCallback($event)"
              icon="pi pi-times"
              rounded="true"
              outlined="true"
              styleClass="h-8 w-8 bg-yellow-300 text-black border-yellow-300 "
            ></p-button>
          </span>
        </div>
        <div class="overflow-y-auto">
          <ul class="list-none p-4 m-0">
            <li>
              <a
                pRipple
                class="flex items-center cursor-pointer p-4 rounded-border dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple text-yellow-300"
              >
                <i class="pi pi-home mr-2"></i>
                <span class="font-medium text-yellow-300">Home</span>
              </a>
            </li>
            <li>
              <a
                pRipple
                class="flex items-center cursor-pointer p-4 rounded-border dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple text-yellow-300"
              >
                <i class="pi pi-shopping-bag mr-2"></i>
                <span class="font-medium text-yellow-300">Menu</span>
              </a>
            </li>
            <li>
              <div
                pRipple
                pStyleClass="@next"
                enterFromClass="hidden"
                enterActiveClass="animate-slidedown"
                leaveToClass="hidden"
                leaveActiveClass="animate-slideup"
                class="p-4 flex items-center justify-between text-surface-600 dark:text-surface-200 cursor-pointer p-ripple"
              >
                <span class="font-medium text-yellow-300 text-xl"
                  >Information</span
                >
                <i class="pi pi-chevron-down text-yellow-300 text-xl"></i>
              </div>
              <ul class="list-none p-0 m-0 overflow-hidden">
                <li>
                  <a
                    pRipple
                    class="flex items-center cursor-pointer p-4 rounded-border dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple text-yellow-300"
                  >
                    <i class="pi pi-home mr-2"></i>
                    <span class="font-medium text-yellow-300">Contact Us</span>
                  </a>
                </li>
                <li>
                  <a
                    pRipple
                    class="flex items-center cursor-pointer p-4 rounded-border dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple text-yellow-300"
                  >
                    <i class="pi pi-bookmark mr-2"></i>
                    <span class="font-medium text-yellow-300">About Us</span>
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </ng-template>
  </p-drawer>
  <p-button
    (click)="visible = true"
    icon="pi pi-bars pi-3x"
    styleClass="border-yellow-300 bg-yellow-300 text-black "
  />
</div>
